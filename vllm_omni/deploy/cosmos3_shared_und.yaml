# Opt-in Nano BF16 TP=1 topology. Initial full-resolution target: H200 141 GB.
pipeline: cosmos3_shared_und
async_chunk: false
model_runner: v1
cfg_companion_wait_timeout_s: 300
dtype: bfloat16
enable_prefix_caching: false
enable_chunked_prefill: true
distributed_executor_backend: mp
stages:
  - stage_id: 0
    devices: "0"
    tensor_parallel_size: 1
    max_num_seqs: 4
    max_model_len: 8192
    max_num_batched_tokens: 4096
    kv_cache_memory_bytes: 8589934592
    async_scheduling: true
    default_sampling_params:
      max_tokens: 2048
      temperature: 0.6
      detokenize: true
  - stage_id: 1
    devices: "0"
    tensor_parallel_size: 1
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: Cosmos3OmniDiffusersPipeline
    model_config:
      external_und: true
      guardrails: false
      sound_gen: false
      action_gen: false
    input_connectors:
      from_stage_0: shared_memory_connector
connectors:
  shared_memory_connector:
    name: SharedMemoryConnector
