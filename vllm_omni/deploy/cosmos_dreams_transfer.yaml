# Cosmos-Dreams-Transfer offline dense-oracle deployment. The checkpoint path
# and immutable schema-v1 conditioning contract come from transformer/config.json.
# Paged cache serving remains a Phase T2 follow-up.

pipeline: cosmos_dreams_transfer
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16
default_resolution: [720, 1280]
max_pixels: 921600

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: CosmosDreamsTransferPipeline
    model_config:
      action_gen: false
      default_fps: 15.0
