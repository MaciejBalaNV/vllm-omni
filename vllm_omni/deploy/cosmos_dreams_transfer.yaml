# Cosmos-Dreams-Transfer offline dense-oracle deployment. The checkpoint path,
# immutable schema-v3 manifest, conditioning contract, and cache geometry come
# from the exported artifact. Paged cache serving remains a Phase T2 follow-up.

pipeline: cosmos_dreams_transfer
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: CosmosDreamsTransferPipeline
    model_config:
      action_gen: false
      default_fps: 15.0
      cosmos_dreams:
        schema_version: 3
