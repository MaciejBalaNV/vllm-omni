<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cosmos-Dreams AgiBot</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #11151b; color: #eef3f8; }
    body { margin: 0 auto; max-width: 1100px; padding: 24px; }
    video { width: 100%; background: #050607; border-radius: 12px; aspect-ratio: 16 / 9; }
    .bar { display: flex; gap: 10px; align-items: center; margin: 14px 0; flex-wrap: wrap; }
    button { padding: 9px 14px; border: 0; border-radius: 8px; cursor: pointer; }
    code { background: #202733; padding: 2px 5px; border-radius: 4px; }
    pre { min-height: 90px; white-space: pre-wrap; background: #0b0e12; padding: 12px; border-radius: 8px; }
    #status[data-error="true"] { color: #ff8b8b; }
  </style>
</head>
<body>
  <h1>Cosmos-Dreams AgiBot</h1>
  <p>Chunk-interactive at 16 pixel frames per tick. Select <code>1</code> left wrist,
    <code>2</code> right wrist, or <code>3</code> head. Move with
    <code>W/S A/D R/F</code>, rotate with <code>I/K J/L U/O</code>, and toggle the selected gripper with Space.</p>
  <video id="video" autoplay playsinline muted></video>
  <div class="bar">
    <button id="connect">Connect</button>
    <button id="reset" disabled>Reset scene</button>
    <button id="disconnect" disabled>Disconnect</button>
    <span id="status">Idle</span>
  </div>
  <pre id="metrics">No chunks yet.</pre>
  <script src="/static/client.js"></script>
</body>
</html>
